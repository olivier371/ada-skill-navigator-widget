name: Update catalogus uit Airtable

on:
  schedule:
    - cron: "0 4 * * *" # dagelijks 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Catalogus ophalen
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN || secrets.AT }}
        run: node scripts/build-catalog.mjs
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet docs/catalog.json; then
            echo "Geen wijzigingen."
          else
            git config user.name "ada-catalog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/catalog.json
            git commit -m "Catalogus bijgewerkt vanuit Airtable"
            git push
          fi
